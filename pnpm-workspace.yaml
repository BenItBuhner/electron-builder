packages:
  - "packages/**"
  - "test"
  - "website"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  core-js: false
  electron: false
  esbuild: false

# 10080 minutes = 7 days
minimumReleaseAge: 10080
# Security fixes whose only patched version is <7d old; deliberately exempted from the age gate
minimumReleaseAgeExclude:
  - esbuild # GHSA-gv7w-rqvm-qjhr: only patched in 0.28.1 (published <7d ago)
  - '@esbuild/*' # platform binaries released in lockstep with esbuild 0.28.1
  # Renovate security update: electron@39.8.10
  - electron@39.8.10
  # Renovate security update: toml@4.2.0
  - toml@4.2.0
  # Renovate security update: js-yaml@4.3.2
  - js-yaml@4.3.2
  # Renovate security update: tar@7.5.21
  - tar@7.5.21
  # Renovate security update: undici@7.29.0
  - undici@7.29.0
  # Oct 2026 CVE sweep: the patched release is newer than minimumReleaseAge
  - body-parser@1.20.9 # CVE-2026-111181
  - fast-uri@3.1.9 # CVE-2026-110306 / CVE-2026-110725
  - serialize-javascript@7.1.3 # CVE-2026-115754
  - serialize-javascript@7.1.4
patchedDependencies:
  '@changesets/cli@2.29.7': patches/@changesets__cli@2.29.7.patch
  '@changesets/assemble-release-plan@6.0.9': patches/@changesets__assemble-release-plan@6.0.9.patch
  estree-walker@3.0.3: patches/estree-walker@3.0.3.patch
overrides:
  flatted: '>=3.4.2'
  # --- Oct 2026 CVE sweep: critical ---
  handlebars: '>=4.7.10 <5' # CVE-2026-106446, CVE-2026-106445
  shell-quote: '>=1.11.0 <2' # CVE-2026-102422, CVE-2026-13311
  tinypool: '>=2.1.2 <3' # CVE-2026-104848, CVE-2026-104849 (no 1.x fix)
  websocket-driver: '>=0.7.5 <0.8' # CVE-2026-54466, CVE-2026-54490
  proxy-addr: '>=2.0.8 <3' # CVE-2026-90711
  # --- Oct 2026 CVE sweep: high and cheap medium/low, kept on the same major ---
  '@babel/core@7': '>=7.29.6 <8' # CVE-2026-49356
  '@conventional-changelog/git-client@1': '>=2.0.0 <3' # CVE-2025-59433 (no 1.x fix)
  'conventional-commits-parser@6': '>=6.4.0 <7' # peer range required by git-client 2.7
  '@humanfs/node': '>=0.16.8 <0.17' # GHSA-p498-v437-472g
  '@swc/html@1.15': '>=1.15.47 <1.16' # CVE-2026-72925
  '@vitest/mocker': '>=5.0.5 <6' # CVE-2026-112949, CVE-2026-112950
  '@vitest/ui': '>=5.0.5 <6' # CVE-2026-112948
  '@xmldom/xmldom@0.8': '>=0.8.15 <0.9' # CVE-2026-83608 and the rest of the 0.8.x xmldom set
  'adm-zip': '>=0.6.1 <0.7' # CVE-2026-77301 and the 0.6.1 set
  'ajv@6': '>=6.14.0 <7' # CVE-2025-69873
  'baseline-browser-mapping': '>=2.11.0 <3' # CVE-2026-45819
  'body-parser@1': '>=1.20.9 <2' # CVE-2026-111181
  'brace-expansion@1': '1.1.21' # CVE-2026-13149 and the 1.1.x set
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
