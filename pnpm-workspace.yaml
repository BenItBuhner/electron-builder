  'picomatch@4': '>=4.0.4 <5'
  postcss: '>=8.5.23 <9' # CVE-2026-73646, CVE-2026-69153
  'postcss-selector-parser@6': '>=6.1.3 <7' # CVE-2026-9358 (6.x has no fix for CVE-2026-104844)
  'postcss-selector-parser@7': '>=7.1.6 <8' # CVE-2026-104844
